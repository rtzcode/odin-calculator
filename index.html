<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Calculator</title>
		<link rel="stylesheet" href="styles.css" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Roboto:ital@0;1&display=swap"
			rel="stylesheet"
		/>
	</head>
	<body>
		<div class="results-container">
			<p class="Results">
				<span id="num1">Enter some digits</span
				><span id="actual-sign"></span><span id="num2"></span>
			</p>
		</div>
		<div class="main-container">
			<div class="buttons-container">
				<div class="numbers">
					<button>1</button>
					<button>2</button>
					<button>3</button>
					<button>4</button>
					<button>5</button>
					<button>6</button>
					<button>7</button>
					<button>8</button>
					<button>9</button>
					<button>0</button>
					<button id="float">.</button>
					<button id="backspace">back</button>
				</div>
				<div class="wrapper">
					<div class="buttons">
						<button id="multiply">*</button>
						<button id="subtract">-</button>
						<button id="divide">/</button>
						<button id="add">+</button>
					</div>
					<div class="buttons">
						<button id="ac">Ac</button>
						<button id="equal">=</button>
					</div>
				</div>
			</div>
		</div>
		<script defer src="script.js"></script>
	</body>
</html>
